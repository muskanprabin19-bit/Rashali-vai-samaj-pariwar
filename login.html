 <!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - रसाली भाई समाज परिवार</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#b30000,#e63946);
  padding:20px;
}

.login-box{
  width:100%;
  max-width:400px;
  background:white;
  padding:30px 22px;
  border-radius:20px;
  box-shadow:0 8px 30px #0004;
  text-align:center;
}

.logo{
  width:85px;
  height:85px;
  margin:auto;
  border-radius:50%;
  background:#f5f5f5;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
}

h1{
  color:#b30000;
  font-size:23px;
  margin-top:15px;
}

.subtitle{
  color:#777;
  margin:8px 0 22px;
  font-size:14px;
}

input{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
}

button{
  width:100%;
  padding:13px;
  margin-top:12px;
  border:0;
  border-radius:25px;
  background:#e63946;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.message{
  margin-top:15px;
  font-size:14px;
}

.back{
  display:inline-block;
  margin-top:18px;
  text-decoration:none;
  color:#b30000;
  font-size:14px;
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">🤝</div>

  <h1>रसाली भाई समाज परिवार</h1>

  <div class="subtitle">
    स्थापना: २०८२<br>
    Member / Admin Login
  </div>

  <form id="loginForm">

    <input
      type="email"
      id="email"
      placeholder="Email"
      required
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      required
    >

    <button type="submit">
      🔐 Login
    </button>

  </form>

  <div id="message" class="message"></div>

  <a class="back" href="index.html">
    ← Home मा फर्कनुहोस्
  </a>

</div>

<script>
const SUPABASE_URL =
"https://hvcalffbwvbwekysukdo.supabase.co";

const SUPABASE_KEY =
"YOUR_PUBLISHABLE_KEY";

const loginForm = document.getElementById("loginForm");
const message = document.getElementById("message");

loginForm.addEventListener("submit", async function(e){

  e.preventDefault();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  message.style.color = "#555";
  message.innerText = "Login हुँदैछ...";

  try{

    const response = await fetch(
      SUPABASE_URL + "/auth/v1/token?grant_type=password",
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json",
          "apikey":SUPABASE_KEY
        },

        body:JSON.stringify({
          email:email,
          password:password
        })
      }
    );

    const data = await response.json();

    if(!response.ok){

      message.style.color = "#b30000";

      message.innerText =
        data.msg ||
        data.error_description ||
        "Email वा Password गलत छ।";

      return;
    }

    localStorage.setItem(
      "rasali_access_token",
      data.access_token
    );

    localStorage.setItem(
      "rasali_user",
      JSON.stringify(data.user)
    );

    message.style.color = "green";
    message.innerText = "Login सफल भयो।";

    setTimeout(function(){
      window.location.href = "index.html";
    },1000);

  }catch(error){

    message.style.color = "#b30000";

    message.innerText =
      "Internet वा Login connection मा समस्या भयो।";

  }

});
</script>

</body>
</html>
