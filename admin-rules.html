 
<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Rules - रसाली भाई समाज परिवार</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172033}
header{background:linear-gradient(120deg,#123c80,#b51f35);color:white;text-align:center;padding:22px 12px}
.container{max-width:850px;margin:20px auto;padding:12px}
.panel{background:white;padding:18px;border-radius:12px;margin-bottom:18px;box-shadow:0 3px 12px #0001}
input,textarea,select{width:100%;padding:12px;margin:7px 0 13px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}
textarea{min-height:110px}
label{font-weight:bold}
button,.link{border:0;border-radius:7px;padding:11px 15px;cursor:pointer;font-size:14px;text-decoration:none;display:inline-block;margin:3px}
.primary{background:#1555a5;color:white}
.green{background:#16834a;color:white}
.red{background:#c62828;color:white}
.gray{background:#64748b;color:white}
.rule{border:1px solid #dbe3ed;border-radius:10px;padding:14px;margin:12px 0}
.rule h3{color:#16447d}
.muted{color:#64748b;font-size:13px}
.status{font-weight:bold;margin:10px 0}
.actions{display:flex;flex-wrap:wrap;gap:5px}
.checkrow{display:flex;align-items:center;gap:9px;margin:8px 0 15px}
.checkrow input{width:auto;margin:0}
</style>
</head>
<body>

<header>
<h2>रसाली भाई समाज परिवार चौराठा</h2>
<div>ADMIN RULES CONTROL CENTER</div>
<div>एकता • सहयोग • सेवा • भाइचारा</div>
</header>

<div class="container">

<div class="panel">
<a class="link primary" href="admin.html">← Admin मा फर्कनुहोस्</a>
<a class="link gray" href="rules.html" target="_blank">सार्वजनिक नियम हेर्नुहोस्</a>
<h3>समाजका नियम व्यवस्थापन</h3>
<p class="muted">नियम थप्ने, सम्पादन गर्ने, हटाउने र प्रकाशित गर्ने।</p>
<div id="status" class="status">जाँच हुँदैछ...</div>
</div>

<div class="panel">
<h3 id="formTitle">नयाँ नियम थप्नुहोस्</h3>

<form id="ruleForm">
<input type="hidden" id="ruleId">

<label>नियमको शीर्षक</label>
<input id="title" required placeholder="नियमको शीर्षक">

<label>नियमको विवरण</label>
<textarea id="ruleText" required placeholder="नियमको पूरा विवरण"></textarea>

<label>नियमको वर्ग</label>
<select id="category">
<option>सामान्य नियम</option>
<option>सदस्यता सम्बन्धी नियम</option>
<option>बचत सम्बन्धी नियम</option>
<option>ऋण सम्बन्धी नियम</option>
<option>ब्याज तथा जरिवाना</option>
<option>अन्य नियम</option>
</select>

<label>क्रम संख्या</label>
<input type="number" id="sortOrder" value="0">

<div class="checkrow">
<input type="checkbox" id="published" checked>
<label for="published">Save गर्दा सार्वजनिक Publish गर्ने</label>
</div>

<button class="primary" type="submit">Save नियम</button>
<button class="gray" type="button" onclick="resetForm()">नयाँ नियम</button>
</form>
</div>

<div class="panel">
<h3>सुरक्षित गरिएका नियमहरू</h3>
<div id="ruleList">लोड हुँदैछ...</div>
</div>
</div>

<script>
const SUPABASE_URL="https://hvcalffbwvbwekysukdo.supabase.co";
const SUPABASE_KEY="sb_publishable_H1JXNd85d9TMWjKO6xWlTg_OZWv8Plt";
const TABLE_URL=SUPABASE_URL+"/rest/v1/society_rules";

const token=localStorage.getItem("rasali_access_token");
const role=localStorage.getItem("rasali_role");

const statusBox=document.getElementById("status");
const ruleList=document.getElementById("ruleList");
let rulesData=[];

if(!token || role!=="admin"){
 alert("Admin मात्रलाई अनुमति छ।");
 location.href="login.html";
}

function headers(extra={}){
 return {
  "apikey":SUPABASE_KEY,
  "Authorization":"Bearer "+token,
  "Content-Type":"application/json",
  ...extra
 };
}

function status(message,success=false){
 statusBox.textContent=message;
 statusBox.style.color=success?"#16834a":"#c62828";
}

function safe(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#039;"
 }[c]));
}

async function loadRules(){
 ruleList.textContent="नियमहरू लोड हुँदैछन्...";

 try{
  const res=await fetch(
   TABLE_URL+"?select=id,rule_number,title,points,category,rule_text,sort_order,is_published,updated_at&order=sort_order.asc,id.asc",
   {headers:headers()}
  );

  const data=await res.json();
  if(!res.ok) throw new Error(data.message||data.details||"लोड हुन सकेन");

  rulesData=data||[];

  if(!rulesData.length){
   ruleList.innerHTML="<p>अहिलेसम्म कुनै नियम छैन।</p>";
   return;
  }

  ruleList.innerHTML=rulesData.map((r,i)=>`
   <div class="rule">
    <h3>नियम ${safe(r.rule_number)}: ${safe(r.title)}</h3>
    <p>${safe(r.rule_text).replace(/\n/g,"<br>")}</p>
    <p class="muted">
     वर्ग: ${safe(r.category||"सामान्य नियम")}
     | क्रम: ${safe(r.sort_order)}
    </p>
    <p>${r.is_published
     ?'<b style="color:green">प्रकाशित</b>'
     :'<b style="color:#c62828">अप्रकाशित</b>'}</p>
    <div class="actions">
     <button class="primary" onclick="editRule(${i})">सम्पादन</button>
     <button class="green" onclick="togglePublish(${i})">
      ${r.is_published?"Unpublish":"Publish"}
     </button>
     <button class="red" onclick="deleteRule(${i})">Delete</button>
    </div>
   </div>
  `).join("");

 }catch(e){
  ruleList.textContent="त्रुटि: "+e.message;
  status("लोड समस्या: "+e.message);
 }
}

async function nextRuleNumber(){
 const res=await fetch(
  TABLE_URL+"?select=rule_number",
  {headers:headers()}
 );

 const data=await res.json();
 if(!res.ok) throw new Error(data.message||"नियम नम्बर प्राप्त भएन");

 let max=0;
 data.forEach(r=>{
  const n=Number(r.rule_number);
  if(Number.isFinite(n)&&n>max) max=n;
 });
 return String(max+1);
}

document.getElementById("ruleForm").addEventListener("submit",async e=>{
 e.preventDefault();

 const id=document.getElementById("ruleId").value;

 const record={
  title:document.getElementById("title").value.trim(),
  rule_text:document.getElementById("ruleText").value.trim(),
  category:document.getElementById("category").value,
  sort_order:Number(document.getElementById("sortOrder").value||0),
  is_published:document.getElementById("published").checked,
  points:[],
  updated_at:new Date().toISOString()
 };

 if(!record.title||!record.rule_text){
  alert("शीर्षक र विवरण अनिवार्य छन्।");
  return;
 }

 try{
  let res;

  if(id){
   res=await fetch(TABLE_URL+"?id=eq."+encodeURIComponent(id),{
    method:"PATCH",
    headers:headers({"Prefer":"return=representation"}),
    body:JSON.stringify(record)
   });
  }else{
   record.rule_number=await nextRuleNumber();

   res=await fetch(TABLE_URL,{
    method:"POST",
    headers:headers({"Prefer":"return=representation"}),
    body:JSON.stringify(record)
   });
  }

  const result=await res.json();
  if(!res.ok) throw new Error(result.message||result.details||"Save हुन सकेन");

  alert(id?"नियम सम्पादन सफल भयो।":"नयाँ नियम सुरक्षित भयो।");
  resetForm();
  status("नियम सुरक्षित भयो।",true);
  await loadRules();

 }catch(err){
  alert("त्रुटि: "+err.message);
  status(err.message);
 }
});

function editRule(i){
 const r=rulesData[i];
 if(!r)return;

 document.getElementById("ruleId").value=r.id;
 document.getElementById("title").value=r.title||"";
 document.getElementById("ruleText").value=r.rule_text||"";
 document.getElementById("category").value=r.category||"सामान्य नियम";
 document.getElementById("sortOrder").value=r.sort_order??0;
 document.getElementById("published").checked=!!r.is_published;
 document.getElementById("formTitle").textContent="नियम सम्पादन गर्नुहोस्";
 window.scrollTo({top:0,behavior:"smooth"});
}

async function togglePublish(i){
 const r=rulesData[i];
 const publish=!r.is_published;

 if(!confirm(publish?"यो नियम सार्वजनिक गर्ने?":"यो नियम अप्रकाशित गर्ने?"))return;

 try{
  const res=await fetch(TABLE_URL+"?id=eq."+encodeURIComponent(r.id),{
   method:"PATCH",
   headers:headers({"Prefer":"return=minimal"}),
   body:JSON.stringify({
    is_published:publish,
    updated_at:new Date().toISOString()
   })
  });

  if(!res.ok)throw new Error(await res.text());

  status("प्रकाशन अवस्था परिवर्तन भयो।",true);
  await loadRules();
 }catch(e){
  alert("त्रुटि: "+e.message);
 }
}

async function deleteRule(i){
 const r=rulesData[i];

 if(!confirm("यो नियम सधैँका लागि हटाउने?"))return;

 try{
  const res=await fetch(TABLE_URL+"?id=eq."+encodeURIComponent(r.id),{
   method:"DELETE",
   headers:headers({"Prefer":"return=minimal"})
  });

  if(!res.ok)throw new Error(await res.text());

  status("नियम हटाइयो।",true);
  await loadRules();
 }catch(e){
  alert("त्रुटि: "+e.message);
 }
}

function resetForm(){
 document.getElementById("ruleForm").reset();
 document.getElementById("ruleId").value="";
 document.getElementById("sortOrder").value=0;
 document.getElementById("published").checked=true;
 document.getElementById("formTitle").textContent="नयाँ नियम थप्नुहोस्";
}

if(token&&role==="admin")loadRules();
</script>
</body>
</html>
