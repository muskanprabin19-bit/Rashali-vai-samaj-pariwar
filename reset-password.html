<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password - रसाली भाई समाज परिवार</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#b30000,#e63946);
  padding:20px;
}

.box{
  width:100%;
  max-width:400px;
  background:white;
  padding:30px 22px;
  border-radius:20px;
  box-shadow:0 8px 30px #0004;
  text-align:center;
}

.logo{
  width:85px;
  height:85px;
  margin:auto;
  border-radius:50%;
  background:#f5f5f5;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
}

h1{
  color:#b30000;
  font-size:23px;
  margin-top:15px;
}

.subtitle{
  color:#777;
  margin:8px 0 22px;
  font-size:14px;
}

input{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
}

button{
  width:100%;
  padding:13px;
  margin-top:12px;
  border:0;
  border-radius:25px;
  background:#e63946;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.message{
  margin-top:15px;
  font-size:14px;
}

.back{
  display:inline-block;
  margin-top:18px;
  text-decoration:none;
  color:#b30000;
  font-size:14px;
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">🔐</div>

  <h1>पासवर्ड परिवर्तन</h1>

  <div class="subtitle">
    नयाँ Password राख्नुहोस्
  </div>

  <form id="resetForm">

    <input
      type="password"
      id="newPassword"
      placeholder="New Password"
      minlength="6"
      required
    >

    <input
      type="password"
      id="confirmPassword"
      placeholder="Confirm Password"
      minlength="6"
      required
    >

    <button type="submit">
      🔐 Password Update गर्नुहोस्
    </button>

  </form>

  <div id="message" class="message"></div>

  <a class="back" href="index.html">
    ← Home मा फर्कनुहोस्
  </a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://hvcalffbwvbwekysukdo.supabase.co";

const SUPABASE_KEY =
"sb_publishable_H1JXNd85d9TMWjKO6xWlTg_OZWv8Plt";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const resetForm =
document.getElementById("resetForm");

const message =
document.getElementById("message");


resetForm.addEventListener(
"submit",
async function(e){

  e.preventDefault();

  const newPassword =
    document.getElementById("newPassword").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;


  if(newPassword !== confirmPassword){

    message.style.color = "#b30000";

    message.innerText =
      "New Password र Confirm Password मिलेन।";

    return;
  }


  message.style.color = "#555";

  message.innerText =
    "Password update हुँदैछ...";


  try{

    const { data, error } =
      await supabaseClient.auth.updateUser({
        password:newPassword
      });


    if(error){

      message.style.color = "#b30000";

      message.innerText =
        error.message;

      return;
    }


    message.style.color = "green";

    message.innerText =
      "Password सफलतापूर्वक परिवर्तन भयो।";


    setTimeout(function(){

      window.location.href =
        "login.html";

    },1500);


  }catch(error){

    message.style.color = "#b30000";

    message.innerText =
      "Internet वा connection मा समस्या भयो।";

  }

});

</script>

</body>
</html>
