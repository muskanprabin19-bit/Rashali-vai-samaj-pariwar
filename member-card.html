 <!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>रसाली भाई समाज परिवार - सदस्यता परिचयपत्र</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eaf0fa;color:#092d62;font-family:"Noto Sans Devanagari","Mangal",Arial,sans-serif}
header{background:linear-gradient(110deg,#07336f,#0757a9);color:#fff;text-align:center;padding:16px 10px}
header h1{font-size:22px;margin:0} header p{margin:4px 0 0;font-size:12px}
.wrap{max-width:1100px;margin:18px auto;padding:12px}
.editor{background:white;padding:16px;border-radius:12px;margin-bottom:20px;box-shadow:0 4px 15px #16345a18}
.editor h2{margin:0 0 12px;font-size:18px}
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
label{font-size:13px;font-weight:bold}
input{display:block;width:100%;padding:10px;border:1px solid #c5d2e5;border-radius:7px;margin-top:4px;font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
button{border:0;border-radius:7px;padding:11px 16px;font-weight:bold;background:#0753a0;color:white}
button.gray{background:#e2eaf5;color:#12345c}
h2.preview{text-align:center;font-size:18px;margin:20px 0;color:#123f7b}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.card{width:100%;max-width:560px;aspect-ratio:1.586;margin:auto;position:relative;overflow:hidden;border:2px solid #d3e4ff;border-radius:18px;background:#fff;box-shadow:0 7px 22px #0a2e6130}
.front{background:linear-gradient(#e9f4ff,#fff 70%,#f2f7ff)}
.front-head{height:18%;background:linear-gradient(110deg,#06428f,#075cba);color:white;text-align:center;padding:8px 4px;border-bottom:2px solid #d8e9ff}
.front-head .nep{font-size:clamp(16px,3vw,27px);font-weight:900;line-height:1.25}
.front-head .eng{font-size:clamp(12px,2.4vw,20px);font-weight:900}
.front-head .loc{font-size:clamp(10px,1.8vw,15px);font-weight:bold}
.motto{position:absolute;z-index:4;top:16.5%;left:19%;width:62%;background:#ffdf36;color:#062c64;border-radius:30px;text-align:center;font-size:clamp(11px,2vw,18px);font-weight:900;padding:4px 3px}
.art{position:absolute;top:18%;left:0;width:100%;height:28%;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#cfe6ff,#fff)}
.art:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(155deg,transparent 0 35px,#fff8 36px 38px),linear-gradient(180deg,#d8ecff,#fff)}
.deity{height:100%;width:29%;object-fit:contain;position:relative;z-index:1}
.seal{height:90%;width:36%;object-fit:contain;position:relative;z-index:2;border-radius:50%;mix-blend-mode:multiply}
.id-ribbon{position:absolute;z-index:5;top:43%;left:0;width:100%;height:10%;display:flex;align-items:center;justify-content:center}
.id-ribbon:before{content:"";position:absolute;left:0;right:0;height:2px;background:#ed1c2d}
.id-ribbon span{position:relative;background:linear-gradient(#ff252d,#df0012);color:white;border-radius:30px;padding:3px 22px;text-align:center;font-size:clamp(14px,2.8vw,25px);font-weight:900;line-height:1.1;box-shadow:0 2px 5px #8b000055}
.id-ribbon small{display:block;font-size:.7em}
.front-details{position:absolute;top:54%;left:2.5%;right:2.5%;height:33%;display:grid;grid-template-columns:29% 1fr 22%;gap:10px;align-items:center}
.photo-box{height:100%;border-radius:13px;background:linear-gradient(135deg,#1688ed,#0862c4);padding:4px;overflow:hidden}
.photo-box img{width:100%;height:100%;object-fit:cover;border-radius:9px;background:#d9e8fa}
.info{font-size:clamp(9px,1.7vw,15px);font-weight:bold;color:#092f70;line-height:1.85;overflow-wrap:anywhere}
.info .name{font-size:1.22em;font-weight:900}
.qrcol{text-align:center;min-width:0}
#qr{display:inline-flex;background:#fff;padding:3px;border:1px solid #b6c8e2;min-width:70px;min-height:70px;align-items:center;justify-content:center}
#qr img,#qr canvas{width:clamp(62px,10vw,100px)!important;height:clamp(62px,10vw,100px)!important}
.qrlabel{font-size:clamp(8px,1.2vw,11px);font-weight:bold;color:white;background:#0754a6;border-radius:7px;padding:4px;margin-top:4px}
.signatures{position:absolute;bottom:5.5%;left:4%;right:4%;height:10%;display:flex;align-items:end;justify-content:space-between;text-align:center;color:#073678;font-weight:bold;font-size:clamp(9px,1.5vw,14px)}
.sig{width:26%;border-bottom:2px solid #123d85;padding-bottom:3px}
.sig em{display:block;font-family:cursive;font-size:22px;font-weight:normal;transform:rotate(-8deg);height:22px}
.estd{position:absolute;bottom:6%;left:37%;width:26%;text-align:center;background:#0753a5;color:white;border-radius:20px;padding:4px;font-weight:bold;font-size:clamp(9px,1.5vw,14px)}
.wave{position:absolute;bottom:0;left:0;width:100%;height:5%;background:linear-gradient(170deg,#e60020 0 22%,#fff 23% 40%,#0751a1 41%);border-radius:0 0 15px 15px}
.back{background:linear-gradient(180deg,#f5f9ff,#eaf3ff 70%,#fff)}
.back-head{height:17%;background:linear-gradient(110deg,#06428f,#075cba);color:white;text-align:center;padding:8px 4px;border-bottom:5px solid #e41c2b}
.back-head .nep{font-size:clamp(16px,3vw,26px);font-weight:900}
.back-head .eng{font-size:clamp(12px,2.3vw,19px);color:#ffdc42;font-weight:900}
.back-content{position:absolute;top:19%;left:6%;right:6%;height:48%;background:linear-gradient(90deg,#ffffffb8,#e8f2ff8c);padding:5px 8px}
.section-title{width:48%;margin:0 auto 8px;text-align:center;background:#0750a0;color:white;border-radius:12px;padding:4px;font-weight:900;font-size:clamp(12px,2.2vw,19px)}
.rows{font-size:clamp(10px,1.9vw,16px);font-weight:bold;line-height:1.9;color:#101d32}
.rows div{display:grid;grid-template-columns:31% 5% 64%;white-space:nowrap}
.purpose{position:absolute;top:68%;left:5%;right:5%;text-align:center}
.purpose .section-title{width:42%;margin-bottom:5px}
.purpose p{font-size:clamp(12px,2.5vw,21px);font-weight:900;color:#073b83;line-height:1.35;margin:0}
.scene{position:absolute;bottom:6%;height:23%;left:0;right:0;background:linear-gradient(180deg,#e9f4ff00,#dcecff)}
.house{position:absolute;left:3%;bottom:0;width:28%;height:85%;color:#082e64}
.people{position:absolute;right:5%;bottom:0;width:45%;height:90%;color:#0751a0}
.back-foot{position:absolute;bottom:0;left:0;right:0;height:8%;background:#07438e;color:white;text-align:center;padding:5px;font-size:clamp(12px,2.2vw,19px);font-weight:900;border-top:5px solid #ed1c2d}
.note{text-align:center;color:#536781;font-size:12px;margin:16px}
@media(max-width:760px){.cards{grid-template-columns:1fr}.fields{grid-template-columns:1fr 1fr}.wrap{padding:8px}}
@media(max-width:390px){.fields{grid-template-columns:1fr}.front-details{gap:5px}.info{line-height:1.65}}
@media print{
 @page{size:A4;margin:10mm}
 body{background:white}
 header,.editor,h2.preview,.note{display:none!important}
 .wrap{margin:0;padding:0;max-width:none}
 .cards{display:flex;flex-direction:column;align-items:center;gap:8mm}
 .card{width:85.6mm;height:54mm;aspect-ratio:auto;box-shadow:none;break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
