<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>मेरो फोटो - रसाली भाई समाज परिवार</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
  background:#f5f5f5;
  color:#222;
  padding:20px;
}

.container{
  max-width:600px;
  margin:auto;
}

.header{
  background:linear-gradient(135deg,#b30000,#e63946);
  color:white;
  padding:22px;
  text-align:center;
  border-radius:15px;
  margin-bottom:20px;
}

.header h2{
  margin-bottom:8px;
}

.photo-box{
  background:white;
  padding:25px;
  border-radius:15px;
  text-align:center;
  box-shadow:0 4px 15px #0002;
}

.photo{
  width:220px;
  height:260px;
  margin:20px auto;
  border:2px solid #b30000;
  border-radius:12px;
  overflow:hidden;
  background:#eee;
  display:flex;
  align-items:center;
  justify-content:center;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

#placeholder{
  font-size:60px;
}

input{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:1px solid #ccc;
  border-radius:8px;
}

button{
  margin-top:15px;
  padding:11px 20px;
  border:0;
  border-radius:20px;
  background:#e63946;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

.back{
  display:inline-block;
  margin-top:20px;
  color:#b30000;
  text-decoration:none;
  font-weight:bold;
}

@media(max-width:400px){
  body{
    padding:12px;
  }

  .photo{
    width:200px;
    height:240px;
  }
}

@media print{
  body{
    background:white;
    padding:0;
  }

  .header,
  input,
  button,
  .back,
  .photo-box h3{
    display:none;
  }

  .photo-box{
    box-shadow:none;
    padding:0;
  }

  .photo{
    margin:auto;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h2>📸 मेरो फोटो</h2>
    <p>रसाली भाई समाज परिवार चौराठा</p>
  </div>

  <div class="photo-box">

    <h3>आफ्नो फोटो</h3>

    <div class="photo">
      <img id="photo" src="" style="display:none;">
      <span id="placeholder">👤</span>
    </div>

    <input
      type="file"
      accept="image/*"
      onchange="loadPhoto(event)"
    >

    <button onclick="window.print()">
      🖨️ Photo Print
    </button>

    <br>

    <a class="back" href="dashboard.html">
      ← Dashboard मा फर्कनुहोस्
    </a>

  </div>

</div>

<script>

function loadPhoto(event){

  const file = event.target.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(e){

    const photo = document.getElementById("photo");

    photo.src = e.target.result;
    photo.style.display = "block";

    document.getElementById("placeholder")
      .style.display = "none";

  };

  reader.readAsDataURL(file);

}

</script>

</body>
</html>
