 <!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>सूचना व्यवस्थापन</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
font-family:Arial,"Noto Sans Devanagari",sans-serif;
background:#f5f5f5;
margin:0;
padding:20px;
}
.box{
max-width:700px;
margin:auto;
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px #ccc;
}
h1{text-align:center;color:#b30000;}
input,textarea{
width:100%;
padding:12px;
margin:8px 0;
box-sizing:border-box;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}
textarea{height:120px;}
button{
padding:10px 18px;
border:0;
border-radius:8px;
background:#007bff;
color:white;
font-size:16px;
margin:5px;
}
.edit{background:#e69500;}
.delete{background:#d00000;}
.notice{
border:1px solid #ddd;
padding:15px;
margin-top:15px;
border-radius:10px;
}
</style>
</head>

<body>

<div class="box">

<h1>📢 सूचना व्यवस्थापन</h1>

<input id="title" placeholder="सूचनाको शीर्षक">

<textarea id="content" placeholder="सूचनाको विवरण"></textarea>

<div style="text-align:center">
<button onclick="saveNotice()">💾 Save सूचना</button>
<button onclick="clearForm()">❌ खाली गर्नुहोस्</button>
</div>

<p id="message"></p>

<hr>

<h2>📋 पहिले राखिएका सूचना</h2>

<div id="noticeList">सूचना लोड हुँदैछ...</div>

<br>

<a href="index.html">🏠 Home</a>

</div>

<script>

const URL="https://hvcalffbwvbwekysukdo.supabase.co";

const KEY="sb_publishable_RPyiwpSS_6UumZ19I_dK9A_ey234mnO";

const db=supabase.createClient(URL,KEY);

let editId=null;


// LOAD
async function loadNotices(){

const list=document.getElementById("noticeList");

const {data,error}=await db
.from("Notices")
.select("*")
.order("Id",{ascending:false});

if(error){
console.log(error);
list.innerHTML="❌ सूचना लोड हुन सकेन";
return;
}

if(!data.length){
list.innerHTML="अहिले कुनै सूचना छैन।";
return;
}

list.innerHTML="";

data.forEach(n=>{

const div=document.createElement("div");
div.className="notice";

div.innerHTML=`
<h3>${n.Title}</h3>
<p>${n.Content}</p>

<button class="edit"
onclick="editNotice(${n.Id},${JSON.stringify(n.Title)},${JSON.stringify(n.Content)})">
✏️ Edit
</button>

<button class="delete"
onclick="deleteNotice(${n.Id})">
🗑️ Delete
</button>
`;

list.appendChild(div);

});

}


// SAVE / UPDATE
async function saveNotice(){

const title=document.getElementById("title").value.trim();
const content=document.getElementById("content").value.trim();
const msg=document.getElementById("message");

if(!title || !content){
msg.innerHTML="⚠️ Title र विवरण लेख्नुहोस्।";
return;
}

msg.innerHTML="⏳ Save हुँदैछ...";

let result;

if(editId===null){

result=await db
.from("Notices")
.insert({
Title:title,
Content:content
});

}else{

result=await db
.from("Notices")
.update({
Title:title,
Content:content
})
.eq("Id",editId);

}

if(result.error){

console.log(result.error);

msg.innerHTML="❌ Save हुन सकेन: "+result.error.message;
return;

}

msg.innerHTML="✅ सूचना सफल भयो।";

clearForm();
loadNotices();

}


// EDIT
function editNotice(id,title,content){

editId=id;

document.getElementById("title").value=title;
document.getElementById("content").value=content;

document.getElementById("message").innerHTML=
"✏️ Edit गर्नुहोस् अनि Save थिच्नुहोस्।";

window.scrollTo(0,0);

}


// DELETE
async function deleteNotice(id){

if(!confirm("यो सूचना Delete गर्ने?")) return;

const {error}=await db
.from("Notices")
.delete()
.eq("Id",id);

if(error){

document.getElementById("message").innerHTML=
"❌ Delete हुन सकेन: "+error.message;

return;

}

document.getElementById("message").innerHTML=
"✅ सूचना Delete भयो।";

loadNotices();

}


// CLEAR
function clearForm(){

document.getElementById("title").value="";
document.getElementById("content").value="";
editId=null;

}


loadNotices();

</script>

</body>
</html>
