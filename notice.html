 <!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>सूचना - रसाली भाई समाज परिवार</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
  background:#f5f5f5;
  margin:0;
  padding:20px;
}
.box{
  max-width:700px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 10px #ccc;
}
h1{
  text-align:center;
  color:#b30000;
}
input,textarea{
  width:100%;
  padding:12px;
  margin:8px 0;
  border:1px solid #ccc;
  border-radius:8px;
  box-sizing:border-box;
  font-size:16px;
}
textarea{
  min-height:120px;
}
button{
  padding:10px 18px;
  border:0;
  border-radius:8px;
  background:#007bff;
  color:white;
  font-size:16px;
  margin:5px;
}
.delete{
  background:#d00;
}
.edit{
  background:#e69500;
}
.notice{
  border:1px solid #ddd;
  border-radius:10px;
  padding:15px;
  margin-top:15px;
  background:#fafafa;
}
.notice h3{
  margin-top:0;
  color:#333;
}
#message{
  text-align:center;
  font-weight:bold;
  margin:10px;
}
</style>
</head>

<body>

<div class="box">

<h1>📢 सूचना</h1>

<input id="title" type="text" placeholder="सूचनाको शीर्षक">

<textarea id="content" placeholder="सूचना लेख्नुहोस्..."></textarea>

<div style="text-align:center;">
<button onclick="saveNotice()">💾 Save</button>
<button onclick="clearForm()">✖ Clear</button>
</div>

<div id="message"></div>

<hr>

<h2>📋 प्रकाशित सूचनाहरू</h2>

<div id="noticeList">सूचना लोड हुँदैछ...</div>

</div>

<script>

const SUPABASE_URL =
"https://hvcalffbwvbwekysukdo.supabase.co";

const SUPABASE_KEY =
"sb_publishable_RPyiwpSS_6UumZ19I_dK9A_ey234mnO";

const supabaseClient =
supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let editId = null;


// सूचना लोड गर्ने
async function loadNotices(){

  const list = document.getElementById("noticeList");

  const { data, error } =
    await supabaseClient
    .from("Notices")
    .select('"Id","Title","Content"')
    .order("Id", { ascending:false });

  if(error){
    list.innerHTML =
      "❌ सूचना लोड हुन सकेन।";
    console.log(error);
    return;
  }

  if(!data || data.length === 0){
    list.innerHTML = "अहिले कुनै सूचना छैन।";
    return;
  }

  list.innerHTML = "";

  data.forEach(item => {

    const div = document.createElement("div");
    div.className = "notice";

    div.innerHTML = `
      <h3>${escapeHtml(item.Title)}</h3>
      <p>${escapeHtml(item.Content)}</p>

      <button class="edit"
        onclick='editNotice(${JSON.stringify(item)})'>
        ✏️ Edit
      </button>

      <button class="delete"
        onclick="deleteNotice(${item.Id})">
        🗑️ Delete
      </button>
    `;

    list.appendChild(div);
  });
}


// Save / Update
async function saveNotice(){

  const title =
    document.getElementById("title").value.trim();

  const content =
    document.getElementById("content").value.trim();

  const message =
    document.getElementById("message");

  if(!title || !content){
    message.innerHTML =
      "⚠️ Title र सूचना दुवै लेख्नुहोस्।";
    return;
  }

  message.innerHTML = "⏳ Save हुँदैछ...";

  let result;

  if(editId === null){

    result =
      await supabaseClient
      .from("Notices")
      .insert([
        {
          "Title": title,
          "Content": content
        }
      ]);

  }else{

    result =
      await supabaseClient
      .from("Notices")
      .update({
        "Title": title,
        "Content": content
      })
      .eq("Id", editId);
  }

  if(result.error){

    console.log(result.error);

    message.innerHTML =
      "❌ सूचना Save हुन सकेन।";

    return;
  }

  message.innerHTML =
    editId === null
    ? "✅ सूचना सफलतापूर्वक Save भयो।"
    : "✅ सूचना सफलतापूर्वक Update भयो।";

  clearForm();
  loadNotices();
}


// Edit
function editNotice(item){

  document.getElementById("title").value =
    item.Title;

  document.getElementById("content").value =
    item.Content;

  editId = item.Id;

  document.getElementById("message").innerHTML =
    "✏️ Edit mode मा हुनुहुन्छ। Save थिच्नुहोस्।";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


// Delete
async function deleteNotice(id){

  if(!confirm("यो सूचना Delete गर्ने हो?")){
    return;
  }

  const { error } =
    await supabaseClient
    .from("Notices")
    .delete()
    .eq("Id", id);

  if(error){

    console.log(error);

    document.getElementById("message").innerHTML =
      "❌ सूचना Delete हुन सकेन।";

    return;
  }

  document.getElementById("message").innerHTML =
    "✅ सूचना Delete भयो।";

  loadNotices();
}


// Clear
function clearForm(){

  document.getElementById("title").value = "";
  document.getElementById("content").value = "";

  editId = null;
}


// HTML सुरक्षित देखाउने
function escapeHtml(text){

  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}


loadNotices();

</script>

</body>
</html>
