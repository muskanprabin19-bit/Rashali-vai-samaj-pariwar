<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>सूचना व्यवस्थापन - रसाली भाई समाज परिवार</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
}

body{
  background:#f5f7fb;
  color:#222;
  padding:20px 12px;
}

.container{
  max-width:700px;
  margin:auto;
}

.box{
  background:white;
  padding:22px;
  border-radius:18px;
  box-shadow:0 3px 15px #0002;
}

h1{
  text-align:center;
  color:#b30000;
  margin-bottom:20px;
  font-size:25px;
}

label{
  display:block;
  margin-top:12px;
  margin-bottom:6px;
  font-weight:bold;
}

input,
textarea{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
  outline:none;
}

textarea{
  min-height:140px;
  resize:vertical;
}

.buttons{
  margin-top:15px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

button,
.home{
  border:0;
  border-radius:20px;
  padding:11px 18px;
  font-size:15px;
  cursor:pointer;
  text-decoration:none;
}

.save{
  background:#198754;
  color:white;
}

.clear{
  background:#777;
  color:white;
}

.home{
  background:#b30000;
  color:white;
}

.status{
  margin-top:15px;
  text-align:center;
  font-weight:bold;
  min-height:22px;
}

.list-title{
  text-align:center;
  color:#b30000;
  margin:25px 0 15px;
}

.notice{
  background:white;
  margin-bottom:15px;
  padding:18px;
  border-left:5px solid #e63946;
  border-radius:12px;
  box-shadow:0 2px 10px #0001;
}

.notice h3{
  color:#b30000;
  margin-bottom:8px;
}

.notice p{
  line-height:1.8;
  white-space:pre-wrap;
}

.notice-buttons{
  margin-top:12px;
}

.edit{
  background:#ffc107;
}

.delete{
  background:#dc3545;
  color:white;
}

.loading{
  text-align:center;
  padding:20px;
  color:#777;
}
</style>
</head>

<body>

<div class="container">

<div class="box">

<h1>📢 सूचना व्यवस्थापन</h1>

<label>सूचनाको शीर्षक</label>

<input
  type="text"
  id="title"
  placeholder="सूचनाको शीर्षक लेख्नुहोस्"
>

<label>सूचनाको विवरण</label>

<textarea
  id="content"
  placeholder="यहाँ सूचना लेख्नुहोस्..."
></textarea>

<div class="buttons">

<button class="save" onclick="saveNotice()">
💾 Save सूचना
</button>

<button class="clear" onclick="clearForm()">
❌ खाली गर्नुहोस्
</button>

<a class="home" href="index.html">
🏠 Home
</a>

</div>

<div id="status" class="status"></div>

</div>


<h2 class="list-title">
📋 पहिले राखिएका सूचना
</h2>

<div id="notice-list">
<div class="loading">
सूचना लोड हुँदैछ...
</div>
</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://hvcalffbwvbwekysukdo.supabase.co";

const SUPABASE_KEY =
"sb_publishable_RPyiwpSS_6UumZ19I_dK9A_ey234mnO";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let editId = null;


/* सूचना देखाउने */

async function loadNotices(){

  const box =
    document.getElementById("notice-list");

  box.innerHTML =
    '<div class="loading">सूचना लोड हुँदैछ...</div>';


  const result =
    await supabaseClient
    .from("Notices")
    .select("*")
    .order("id", { ascending:false });


  if(result.error){

    console.log("NOTICE ERROR:",result.error);

    box.innerHTML =
    `
    <div class="notice">
      <h3>⚠️ सूचना लोड हुन सकेन</h3>
      <p>Supabase बाट सूचना प्राप्त गर्न समस्या भयो।</p>
    </div>
    `;

    return;
  }


  const data = result.data;


  box.innerHTML = "";


  if(!data || data.length === 0){

    box.innerHTML =
    `
    <div class="notice">
      <h3>📢 सूचना</h3>
      <p>हाल कुनै नयाँ सूचना छैन।</p>
    </div>
    `;

    return;
  }


  data.forEach(function(notice){

    const item =
      document.createElement("div");

    item.className = "notice";


    const title =
      document.createElement("h3");

    title.textContent =
      "📢 " + (notice.title || "");


    const content =
      document.createElement("p");

    content.textContent =
      notice.content || "";


    const buttons =
      document.createElement("div");

    buttons.className =
      "notice-buttons";


    const editButton =
      document.createElement("button");

    editButton.className =
      "edit";

    editButton.textContent =
      "✏️ Edit";


    editButton.onclick =
      function(){

        editNotice(
          notice.id,
          notice.title || "",
          notice.content || ""
        );

      };


    const deleteButton =
      document.createElement("button");

    deleteButton.className =
      "delete";

    deleteButton.textContent =
      "🗑️ Delete";


    deleteButton.onclick =
      function(){

        deleteNotice(notice.id);

      };


    buttons.appendChild(editButton);
    buttons.appendChild(deleteButton);

    item.appendChild(title);
    item.appendChild(content);
    item.appendChild(buttons);

    box.appendChild(item);

  });

}


/* नयाँ सूचना Save / पुरानो Edit */

async function saveNotice(){

  const title =
    document.getElementById("title").value.trim();

  const content =
    document.getElementById("content").value.trim();


  if(title === "" || content === ""){

    showStatus(
      "⚠️ शीर्षक र विवरण दुवै लेख्नुहोस्।"
    );

    return;
  }


  /* EDIT */

  if(editId !== null){

    const result =
      await supabaseClient
      .from("Notices")
      .update({
        title:title,
        content:content
      })
      .eq("id",editId);


    if(result.error){

      console.log(
        "EDIT ERROR:",
        result.error
      );

      showStatus(
        "❌ सूचना Edit हुन सकेन।"
      );

      return;
    }


    showStatus(
      "✅ सूचना सफलतापूर्वक Edit भयो।"
    );


  }


  /* NEW SAVE */

  else{

    const result =
      await supabaseClient
      .from("Notices")
      .insert([
        {
          title:title,
          content:content
        }
      ]);


    if(result.error){

      console.log(
        "SAVE ERROR:",
        result.error
      );

      showStatus(
        "❌ सूचना Save हुन सकेन।"
      );

      return;
    }


    showStatus(
      "✅ सूचना सफलतापूर्वक Save भयो।"
    );

  }


  clearForm();

  await loadNotices();

}


/* Edit */

function editNotice(
  id,
  title,
  content
){

  editId = id;


  document.getElementById("title").value =
    title;


  document.getElementById("content").value =
    content;


  document.getElementById("title").focus();


  showStatus(
    "✏️ सूचना Edit गर्न तयार छ।"
  );

}


/* Delete */

async function deleteNotice(id){

  const answer =
    confirm(
      "यो सूचना Delete गर्ने हो?"
    );


  if(!answer){

    return;
  }


  const result =
    await supabaseClient
    .from("Notices")
    .delete()
    .eq("id",id);


  if(result.error){

    console.log(
      "DELETE ERROR:",
      result.error
    );

    showStatus(
      "❌ सूचना Delete हुन सकेन।"
    );

    return;
  }


  showStatus(
    "🗑️ सूचना Delete भयो।"
  );


  await loadNotices();

}


/* Form खाली */

function clearForm(){

  editId = null;


  document.getElementById("title").value =
    "";


  document.getElementById("content").value =
    "";


  showStatus("");

}


/* Message */

function showStatus(message){

  document.getElementById("status").textContent =
    message;

}


/* सुरुमा सूचना लोड */

loadNotices();

</script>

</body>
</html>
