 
<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>रसाली समाज परिवार - भौचर</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e8eef5;font-family:"Noto Sans Devanagari",Arial,sans-serif;color:#073c70}
button,input,select{font:inherit}
.toolbar{padding:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{border:0;border-radius:7px;padding:10px 15px;background:#07518a;color:white;font-weight:bold;cursor:pointer}
button.secondary{background:#526579}
button.danger{background:#b52c36}
.sheet{width:min(100%,1100px);margin:0 auto 25px;position:relative;aspect-ratio:1536/1024;background:white}
.sheet img{width:100%;height:100%;display:block}
.field{position:absolute;border:0;background:transparent;color:#073c70;font-weight:600;outline:none;padding:2px;min-width:0}
.field:focus{background:#fff9d9;outline:1px dashed #1766a2}
.type{position:absolute;left:37%;top:28.5%;width:26%;height:9%;text-align:center;border:0;background:#07518a;color:white;font-size:clamp(13px,2.2vw,25px);font-weight:bold;border-radius:5px}
.vno{left:81.2%;top:29.8%;width:15%;height:3%;font-size:clamp(9px,1.2vw,15px)}
.date{left:81.2%;top:34.2%;width:15%;height:3%;font-size:clamp(9px,1.2vw,15px)}
.name{left:10.5%;top:41.5%;width:50%;height:3%;font-size:clamp(9px,1.1vw,14px)}
.position{left:78%;top:41.5%;width:18%;height:3%;font-size:clamp(9px,1.1vw,14px)}
.address{left:10.5%;top:45.5%;width:50%;height:3%;font-size:clamp(9px,1.1vw,14px)}
.phone{left:78%;top:45.5%;width:18%;height:3%;font-size:clamp(9px,1.1vw,14px)}
.rows{position:absolute;left:9.6%;top:53.5%;width:87.5%;height:21.4%;display:grid;grid-template-rows:repeat(5,1fr)}
.entry{display:grid;grid-template-columns:44.5% 18.5% 18.5% 18.5%;min-height:0}
.entry input{border:0;background:transparent;text-align:center;width:100%;min-width:0;color:#073c70;font-size:clamp(8px,1vw,13px);padding:0 3px}
.entry input:focus{background:#fff9d9;outline:1px dashed #1766a2}
.totaltext{position:absolute;left:38%;top:72.5%;width:34%;height:4%;font-size:clamp(8px,1vw,13px)}
.totalnumber{position:absolute;left:80%;top:72.5%;width:16%;height:4%;font-size:clamp(9px,1.2vw,15px)}
.payment{position:absolute;left:15%;top:77.5%;width:53%;height:3%;display:flex;gap:3%;align-items:center;font-size:clamp(8px,1vw,13px)}
.payment label{display:flex;align-items:center;white-space:nowrap}
.payment input{accent-color:#07518a}
.other{width:25%;border:0;border-bottom:1px dotted #07518a;background:transparent;min-width:30px}
.sig1{position:absolute;left:5%;top:87.5%;width:21%;height:3%;text-align:center}
.sig2{position:absolute;left:27%;top:87.5%;width:21%;height:3%;text-align:center}
.sig3{position:absolute;left:51%;top:87.5%;width:21%;height:3%;text-align:center}
.sign{background:transparent;border:0;border-bottom:1px dotted #07518a;width:85%;text-align:center;font-size:clamp(8px,1vw,12px)}
.records{max-width:1100px;margin:15px auto;background:white;padding:15px;border-radius:10px}
.records h3{margin:4px 0 12px}
.record{display:flex;justify-content:space-between;gap:8px;padding:8px;border-bottom:1px solid #ddd;align-items:center}
.record button{padding:6px 10px}
@media print{
 @page{size:A4 landscape;margin:0}
 body{background:white}
 .toolbar,.records{display:none!important}
 .sheet{width:297mm;height:198mm;margin:7mm auto 0;break-inside:avoid}
 .field:focus{background:transparent;outline:none}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<div class="toolbar">
<button onclick="newVoucher()">＋ नयाँ भौचर</button>
<button onclick="saveVoucher()">💾 सुरक्षित गर्नुहोस्</button>
<button onclick="showRecords()">📂 पुरानो खोल्नुहोस्</button>
<button onclick="window.print()">🖨️ Print / PDF</button>
<button class="secondary" onclick="exportCSV()">Excel / CSV</button>
<button class="danger" onclick="clearForm()">खाली गर्नुहोस्</button>
</div>

<div class="sheet" id="sheet">
<img src="voucher-bg.png" alt="रसाली भाई समाज परिवारको मूल भौचर डिजाइन">

<select class="type" id="voucherType">
<option value="आम्दानी">आम्दानी भौचर</option>
<option value="खर्च">खर्च भौचर</option>
</select>

<input class="field vno" id="vno" placeholder="भौचर नं.">
<input class="field date" id="date" type="date">

<input class="field name" id="name" placeholder="सदस्यको नाम">
<input class="field position" id="position" placeholder="पद">
<input class="field address" id="address" placeholder="ठेगाना">
<input class="field phone" id="phone" placeholder="सम्पर्क नं.">

<div class="rows" id="rows">
<script>
for(let i=0;i<5;i++){
 document.write(`
 <div class="entry">
 <input placeholder="विवरण">
 <input class="deposit" type="number" min="0" step="0.01" placeholder="0">
 <input class="withdraw" type="number" min="0" step="0.01" placeholder="0">
 <input placeholder="कैफियत">
 </div>`);
}
</script>
</div>

<input class="field totaltext" id="words" placeholder="अक्षरमा जम्मा रकम">
<input class="field totalnumber" id="total" readonly placeholder="0.00">

<div class="payment">
<label><input type="checkbox" name="pay" value="नगद"> नगद</label>
<label><input type="checkbox" name="pay" value="बैंक ट्रान्सफर"> बैंक ट्रान्सफर</label>
<label><input type="checkbox" name="pay" value="अन्य"> अन्य</label>
<input class="other" id="otherPayment" placeholder="अन्य माध्यम">
</div>

<input class="field sign sig1" id="prepared" placeholder="नाम / हस्ताक्षर">
<input class="field sign sig2" id="treasurer" placeholder="नाम / हस्ताक्षर">
<input class="field sign sig3" id="chairman" value="दीपक रसाली">
</div>

<div class="records" id="records" style="display:none">
<h3>📂 सुरक्षित भौचरहरू</h3>
<div id="recordList"></div>
</div>

<script>
const $=id=>document.getElementById(id);

function amount(){
 let d=[...document.querySelectorAll('.deposit')]
   .reduce((s,e)=>s+(Number(e.value)||0),0);
 let w=[...document.querySelectorAll('.withdraw')]
   .reduce((s,e)=>s+(Number(e.value)||0),0);
 $('total').value=(d+w).toFixed(2);
 return {deposit:d,withdraw:w,total:d+w};
}

document.addEventListener('input',e=>{
 if(e.target.matches('.deposit,.withdraw')) amount();
});

function getData(){
 return {
 type:$('voucherType').value,
 vno:$('vno').value,
 date:$('date').value,
 name:$('name').value,
 position:$('position').value,
 address:$('address').value,
 phone:$('phone').value,
 rows:[...document.querySelectorAll('.entry')].map(row=>
 [...row.querySelectorAll('input')].map(x=>x.value)),
 words:$('words').value,
 payment:[...document.querySelectorAll('input[name="pay"]:checked')].map(x=>x.value),
 otherPayment:$('otherPayment').value,
 prepared:$('prepared').value,
 treasurer:$('treasurer').value,
 chairman:$('chairman').value
 };
}

function setData(d){
 $('voucherType').value=d.type||'आम्दानी';
 ['vno','date','name','position','address','phone','words',
 'otherPayment','prepared','treasurer','chairman'].forEach(k=>{
 $(k).value=d[k]||'';
 });
 document.querySelectorAll('.entry').forEach((row,i)=>{
 [...row.querySelectorAll('input')].forEach((x,j)=>{
 x.value=d.rows?.[i]?.[j]||'';
 });
 });
 document.querySelectorAll('input[name="pay"]').forEach(x=>{
 x.checked=(d.payment||[]).includes(x.value);
 });
 amount();
}

function newVoucher(){
 if(!confirm('नयाँ भौचर खोल्ने? पहिले सुरक्षित गर्नुहोस्।'))return;
 clearForm(false);
 $('date').value=new Date().toISOString().slice(0,10);
 $('vno').value='RS-'+Date.now().toString().slice(-6);
}

function clearForm(ask=true){
 if(ask&&!confirm('सबै विवरण खाली गर्ने?'))return;
 setData({});
 $('date').value=new Date().toISOString().slice(0,10);
 $('vno').value='RS-'+Date.now().toString().slice(-6);
}

function saveVoucher(){
 if(!$('vno').value){alert('भौचर नम्बर राख्नुहोस्।');return;}
 let data=getData();
 let list=JSON.parse(localStorage.getItem('rasali_vouchers')||'[]');
 let index=list.findIndex(x=>x.vno===data.vno);
 if(index>=0)list[index]=data;
 else list.push(data);
 localStorage.setItem('rasali_vouchers',JSON.stringify(list));
 alert('भौचर सुरक्षित भयो।');
}

function showRecords(){
 let list=JSON.parse(localStorage.getItem('rasali_vouchers')||'[]');
 $('records').style.display='block';
 $('recordList').innerHTML='';
 if(!list.length){
 $('recordList').textContent='अहिलेसम्म कुनै भौचर सुरक्षित गरिएको छैन।';
 return;
 }
 list.forEach((d,i)=>{
 let div=document.createElement('div');
 div.className='record';
 let title=document.createElement('span');
 title.textContent=`${d.vno} | ${d.name} | ${d.date} | रु. ${d.total||0}`;
 let open=document.createElement('button');
 open.textContent='खोल्नुहोस्';
 open.onclick=()=>{setData(d);window.scrollTo(0,0);};
 let del=document.createElement('button');
 del.className='danger';
 del.textContent='हटाउनुहोस्';
 del.onclick=()=>{
 if(confirm('यो भौचर हटाउने?')){
 list.splice(i,1);
 localStorage.setItem('rasali_vouchers',JSON.stringify(list));
 showRecords();
 }
 };
 div.append(title,open,del);
 $('recordList').append(div);
 });
}

function exportCSV(){
 let list=JSON.parse(localStorage.getItem('rasali_vouchers')||'[]');
 if(!list.length){alert('पहिले भौचर सुरक्षित गर्नुहोस्।');return;}
 let csv='\uFEFFभौचर नं,मिति,प्रकार,नाम,पद,ठेगाना,सम्पर्क,जम्मा\n';
 list.forEach(d=>{
 csv+=[d.vno,d.date,d.type,d.name,d.position,d.address,d.phone,d.total||0]
 .map(x=>'"'+String(x||'').replace(/"/g,'""')+'"').join(',')+'\n';
 });
 let a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
 a.download='Rasali-Voucher-Records.csv';
 a.click();
 URL.revokeObjectURL(a.href);
}

newVoucher();
</script>
</body>
</html>
