 
<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>रसाली भाई समाज परिवार चौराठा | भौचर</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eaf0f8;font-family:Arial,sans-serif;color:#18365f}
.page{max-width:1000px;margin:15px auto;padding:20px;background:white;border:2px solid #244d80}
header{text-align:center;border-bottom:3px solid #244d80;padding-bottom:12px}
header h2{margin:5px;color:#183d70}
header p{margin:5px}
h3{text-align:center;color:#183d70}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
label{display:block;font-weight:bold;font-size:14px;margin-bottom:5px}
input,select,textarea{width:100%;padding:9px;border:1px solid #9aacc4;border-radius:4px;font-size:15px}
textarea{min-height:60px}
.section{margin-top:16px;padding:12px;border:1px solid #9aacc4}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #8fa4c0;padding:7px;text-align:left}
th{background:#e5edf8}
td input{border:0;padding:4px;min-width:50px}
button{padding:10px 13px;margin:4px;border:0;border-radius:5px;background:#244d80;color:white;font-weight:bold}
.secondary{background:#526980}
.danger{background:#a22}
.actions{text-align:center;margin:15px 0}
.totals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.signatures{display:flex;justify-content:space-between;text-align:center;margin-top:50px;gap:20px}
.signatures div{width:45%;border-top:1px solid #333;padding-top:8px}
@media(max-width:600px){.page{margin:4px;padding:10px}.grid,.totals{grid-template-columns:1fr}table{font-size:12px}th,td{padding:4px}}
@media print{body{background:white}.page{margin:0;border:1px solid #244d80;padding:10px}.no-print{display:none!important}input,textarea,select{border:0;padding:3px}.section{break-inside:avoid}}
</style>
</head>
<body>
<div class="page">
<header>
<h2>रसाली भाई समाज परिवार चौराठा</h2>
<p>चौराठा, दैलेख, नेपाल</p>
<p>एकता • सहयोग • सेवा • भाइचारा</p>
<p>स्थापना: २०८२</p>
</header>

<h3>आम्दानी / खर्च भौचर</h3>
<div class="grid">
<div><label>भौचर नम्बर</label><input id="no" placeholder="V-001"></div>
<div><label>मिति</label><input id="date" type="date"></div>
<div><label>प्रकार</label><select id="type"><option>आम्दानी</option><option>खर्च</option><option>जम्मा</option><option>निकासा</option></select></div>
<div><label>सदस्यको नाम</label><input id="member" placeholder="पूरा नाम"></div>
<div><label>फोन नम्बर</label><input id="phone" placeholder="फोन नम्बर"></div>
<div><label>रकम (रु.)</label><input id="amount" type="number" min="0" value="0"></div>
<div><label>ब्याज (रु.)</label><input id="interest" type="number" min="0" value="0"></div>
<div><label>जरिवाना (रु.)</label><input id="penalty" type="number" min="0" value="0"></div>
</div>

<div class="section">
<label>विवरण / प्रयोजन</label>
<textarea id="description" placeholder="रकमको विवरण"></textarea>
<div class="grid" style="margin-top:10px">
<div><label>रकम बुझाउने</label><input id="payer"></div>
<div><label>रकम बुझ्ने</label><input id="receiver"></div>
</div>
</div>

<div class="section">
<h3>हिसाब किताब</h3>
<div class="grid">
<div><label>सुरुको बाँकी</label><input id="opening" type="number" min="0" value="0"></div>
<div><label>थप जम्मा</label><input id="deposit" type="number" min="0" value="0"></div>
<div><label>थप निकासा</label><input id="withdrawal" type="number" min="0" value="0"></div>
</div>
<table>
<thead><tr><th>मिति</th><th>विवरण</th><th>जम्मा</th><th>निकासा</th><th class="no-print">कार्य</th></tr></thead>
<tbody id="ledger"></tbody>
</table>
<button class="no-print" onclick="addRow()">+ हिसाब थप्नुहोस्</button>
<div class="totals">
<div><label>कुल जम्मा</label><input id="totalDeposit" readonly value="0"></div>
<div><label>कुल निकासा</label><input id="totalWithdrawal" readonly value="0"></div>
<div><label>कुल ब्याज</label><input id="totalInterest" readonly value="0"></div>
<div><label>कुल जरिवाना</label><input id="totalPenalty" readonly value="0"></div>
<div><label>अन्तिम बाँकी</label><input id="balance" readonly value="0"></div>
</div>
</div>

<div class="actions no-print">
<button onclick="saveRecord()">रेकर्ड सुरक्षित गर्नुहोस्</button>
<button class="secondary" onclick="newRecord()">नयाँ भौचर</button>
<button class="secondary" onclick="window.print()">Print / PDF</button>
</div>

<div class="section no-print">
<h3>सुरक्षित भौचरहरू</h3>
<table>
<thead><tr><th>नम्बर</th><th>मिति</th><th>सदस्य</th><th>प्रकार</th><th>कार्य</th></tr></thead>
<tbody id="records"></tbody>
</table>
<button class="secondary" onclick="backup()">ब्याकअप डाउनलोड</button>
</div>

<div class="signatures">
<div>संस्थापक<br><b>पदम रसाली</b></div>
<div>अध्यक्ष<br><b>दीपक रसाली</b></div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const fields=['no','date','type','member','phone','amount','interest','penalty','description','payer','receiver','opening','deposit','withdrawal'];
let ledger=[],editing=null,db={};
try{db=JSON.parse(localStorage.getItem('rasaliVouchers')||'{}')}catch(e){}
$('date').value=new Date().toISOString().slice(0,10);
const n=id=>Math.max(0,Number($(id).value)||0);

function addRow(r={}){
ledger.push({date:r.date||$('date').value,description:r.description||'',deposit:+r.deposit||0,withdrawal:+r.withdrawal||0});
renderLedger();
}
function renderLedger(){
$('ledger').innerHTML='';
ledger.forEach((r,i)=>{
let tr=document.createElement('tr');
[['date','date'],['description','text'],['deposit','number'],['withdrawal','number']].forEach(([k,t])=>{
let td=document.createElement('td'),el=document.createElement('input');
el.type=t;el.value=r[k];if(t==='number')el.min='0';
el.oninput=()=>{ledger[i][k]=t==='number'?Math.max(0,+el.value||0):el.value;calculate()};
td.append(el);tr.append(td);
});
let td=document.createElement('td'),b=document.createElement('button');
b.textContent='हटाउनुहोस्';b.className='danger';
b.onclick=()=>{ledger.splice(i,1);renderLedger()};
td.className='no-print';td.append(b);tr.append(td);$('ledger').append(tr);
});
calculate();
}
function calculate(){
let d=n('deposit'),w=n('withdrawal');
ledger.forEach(r=>{d+=+r.deposit||0;w+=+r.withdrawal||0});
$('totalDeposit').value=d.toFixed(2);
$('totalWithdrawal').value=w.toFixed(2);
$('totalInterest').value=n('interest').toFixed(2);
$('totalPenalty').value=n('penalty').toFixed(2);
$('balance').value=(n('opening')+d-w).toFixed(2);
}
fields.forEach(id=>$(id).addEventListener('input',calculate));
function getRecord(){
let o={};fields.forEach(id=>o[id]=$(id).value);
o.ledger=ledger.map(r=>({...r}));return o;
}
function saveRecord(){
let key=$('no').value.trim();
if(!key){alert('भौचर नम्बर लेख्नुहोस्');return}
if(editing&&editing!==key)delete db[editing];
db[key]=getRecord();
try{localStorage.setItem('rasaliVouchers',JSON.stringify(db));editing=key;renderRecords();alert('रेकर्ड सुरक्षित भयो')}
catch(e){alert('रेकर्ड सुरक्षित भएन। ब्याकअप निकाल्नुहोस्।')}
}
function loadRecord(key){
let o=db[key];if(!o)return;
editing=key;fields.forEach(id=>$(id).value=o[id]??'');
ledger=(o.ledger||[]).map(r=>({...r}));renderLedger();
window.scrollTo({top:0,behavior:'smooth'});
}
function renderRecords(){
$('records').innerHTML='';
Object.keys(db).forEach(key=>{
let o=db[key],tr=document.createElement('tr');
[key,o.date||'',o.member||'',o.type||''].forEach(v=>{
let td=document.createElement('td');td.textContent=v;tr.append(td);
});
let td=document.createElement('td'),b=document.createElement('button');
b.textContent='सम्पादन';b.onclick=()=>loadRecord(key);td.append(b);
let del=document.createElement('button');del.textContent='हटाउने';del.className='danger';
del.onclick=()=>{if(confirm('यो रेकर्ड हटाउने?')){delete db[key];localStorage.setItem('rasaliVouchers',JSON.stringify(db));if(editing===key)newRecord();renderRecords()}};
td.append(del);tr.append(td);$('records').append(tr);
});
}
function newRecord(){
fields.forEach(id=>$(id).value='');
$('date').value=new Date().toISOString().slice(0,10);
['amount','interest','penalty','opening','deposit','withdrawal'].forEach(id=>$(id).value='0');
editing=null;ledger=[];renderLedger();
}
function backup(){
let a=document.createElement('a');
a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));
a.download='rasali-voucher-backup.json';a.click();URL.revokeObjectURL(a.href);
}
renderLedger();renderRecords();
</script>
</body>
</html>
