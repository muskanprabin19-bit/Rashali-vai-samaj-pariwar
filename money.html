 <!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>मेरो पैसाको हिसाब - रसाली भाई समाज परिवार</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
  background:#f5f5f5;
  color:#222;
  padding:15px;
}

.container{
  max-width:900px;
  margin:auto;
}

.header{
  background:linear-gradient(135deg,#b30000,#e63946);
  color:white;
  text-align:center;
  padding:25px 15px;
  border-radius:15px;
  margin-bottom:20px;
}

.header h1{
  font-size:22px;
}

.header p{
  margin-top:7px;
}

.member{
  background:white;
  padding:15px;
  border:1px solid #999;
  border-radius:10px;
  margin-bottom:15px;
  text-align:center;
}

.summary{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-bottom:20px;
}

.box{
  background:white;
  padding:15px 8px;
  text-align:center;
  border:1px solid #999;
  border-radius:8px;
}

.box h3{
  font-size:14px;
  margin-bottom:8px;
}

.box p{
  font-size:20px;
  font-weight:bold;
}

.history{
  background:white;
  padding:15px;
  border:1px solid #888;
  border-radius:10px;
}

.history h2{
  color:#b30000;
  text-align:center;
  margin-bottom:15px;
}

.table-wrap{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  min-width:650px;
  border-collapse:collapse;
  background:white;
}

th,
td{
  border:1px solid #777;
  padding:10px 8px;
  text-align:center;
}

th{
  background:#eeeeee;
  font-weight:bold;
}

td{
  font-size:14px;
}

.message{
  text-align:center;
  padding:15px;
  color:#555;
}

.error{
  color:#b30000;
}

.back{
  display:block;
  text-align:center;
  margin:20px 0;
  color:#b30000;
  text-decoration:none;
  font-weight:bold;
}

@media(max-width:600px){

  .summary{
    grid-template-columns:1fr;
  }

  th,
  td{
    padding:8px 6px;
    font-size:13px;
  }

}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>💰 मेरो पैसाको हिसाब</h1>
    <p>रसाली भाई समाज परिवार चौराठा</p>
  </div>

  <div class="member">
    <strong id="memberName">सदस्यको हिसाब</strong>
    <br>
    <small id="memberId"></small>
  </div>

  <div class="summary">

    <div class="box">
      <h3>जम्मा रकम</h3>
      <p id="totalIn">रु. 0</p>
    </div>

    <div class="box">
      <h3>निकालेको रकम</h3>
      <p id="totalOut">रु. 0</p>
    </div>

    <div class="box">
      <h3>बाँकी रकम</h3>
      <p id="balance">रु. 0</p>
    </div>

  </div>

  <div class="history">

    <h2>📋 मेरो हिसाब विवरण</h2>

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>सदस्य</th>
            <th>प्रकार</th>
            <th>रकम</th>
            <th>मिति</th>
            <th>विवरण</th>
          </tr>
        </thead>

        <tbody id="entries">

          <tr>
            <td colspan="5" class="message">
              हिसाब खोजिँदैछ...
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </div>

  <a class="back" href="dashboard.html">
    ← Dashboard मा फर्कनुहोस्
  </a>

</div>

<script>

const SUPABASE_URL =
"https://hvcalffbwvbwekysukdo.supabase.co";

const SUPABASE_KEY =
"sb_publishable_H1JXNd85d9TMWjKO6xWlTg_OZWv8Plt";

const entriesBox =
document.getElementById("entries");


async function loadMoney(){

  try{

    const accessToken =
      localStorage.getItem("rasali_access_token");

    const memberId =
      localStorage.getItem("rasali_member_id");


    if(!accessToken){

      entriesBox.innerHTML =
      '<tr><td colspan="5" class="message error">पहिले Login गर्नुहोस्।</td></tr>';

      return;
    }


    if(!memberId){

      entriesBox.innerHTML =
      '<tr><td colspan="5" class="message error">सदस्य ID भेटिएन।</td></tr>';

      return;
    }


    document.getElementById("memberId").textContent =
      "Member ID: " + memberId;


    /* MEMBER NAME */

    const memberResponse =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/members?id=eq." +
        encodeURIComponent(memberId) +
        "&select=id,name,position",
        {
          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":"Bearer " + accessToken
          }
        }
      );


    const members =
      await memberResponse.json();


    if(!memberResponse.ok){

      entriesBox.innerHTML =
      '<tr><td colspan="5" class="message error">सदस्य विवरण निकाल्न सकिएन।</td></tr>';

      return;
    }


    let memberName = "सदस्य";

    if(members.length > 0){

      memberName =
        members[0].name || "सदस्य";

      document.getElementById("memberName").textContent =
        memberName;
    }


    /* MONEY RECORDS */

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/money_records?member_id=eq." +
        encodeURIComponent(memberId) +
        "&select=id,record_type,person,amount,record_date,description&order=record_date.desc",
        {
          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":"Bearer " + accessToken
          }
        }
      );


    const records =
      await response.json();


    if(!response.ok){

      entriesBox.innerHTML =
      '<tr><td colspan="5" class="message error">हिसाब निकाल्न समस्या भयो।</td></tr>';

      return;
    }


    let totalIn = 0;
    let totalOut = 0;


    entriesBox.innerHTML = "";


    if(records.length === 0){

      entriesBox.innerHTML =
      '<tr><td colspan="5" class="message">यस सदस्यको अहिलेसम्म कुनै हिसाब छैन।</td></tr>';

    }


    records.forEach(function(item){

      const amount =
        Number(item.amount) || 0;


      if(item.record_type === "income"){
        totalIn += amount;
      }


      if(item.record_type === "expense"){
        totalOut += amount;
      }


      const row =
        document.createElement("tr");


      row.innerHTML = `

        <td>${memberName}</td>

        <td>
          ${
            item.record_type === "income"
            ? "जम्मा"
            : "निकालेको"
          }
        </td>

        <td>
          रु. ${amount.toLocaleString()}
        </td>

        <td>
          ${item.record_date || "-"}
        </td>

        <td>
          ${item.description || "-"}
        </td>

      `;


      entriesBox.appendChild(row);

    });


    document.getElementById("totalIn").textContent =
      "रु. " + totalIn.toLocaleString();


    document.getElementById("totalOut").textContent =
      "रु. " + totalOut.toLocaleString();


    document.getElementById("balance").textContent =
      "रु. " +
      (totalIn - totalOut).toLocaleString();


  }catch(error){

    entriesBox.innerHTML =
    '<tr><td colspan="5" class="message error">Internet वा Supabase connection मा समस्या भयो।</td></tr>';

    console.log(error);

  }

}


loadMoney();

</script>

</body>
</html>
