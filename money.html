 <!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>मेरो पैसाको हिसाब - रसाली भाई समाज परिवार</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
  background:#f5f5f5;
  color:#222;
  padding:15px;
}

.container{max-width:700px;margin:auto}

.header{
  background:linear-gradient(135deg,#b30000,#e63946);
  color:white;
  text-align:center;
  padding:25px 15px;
  border-radius:15px;
  margin-bottom:20px;
}

.header h1{font-size:22px}
.header p{margin-top:7px}

.member{
  background:white;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
  text-align:center;
  box-shadow:0 3px 12px #0002;
}

.summary{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-bottom:20px;
}

.box{
  background:white;
  padding:18px 8px;
  text-align:center;
  border-radius:12px;
  box-shadow:0 3px 12px #0002;
}

.box h3{font-size:14px;margin-bottom:8px}
.box p{font-size:20px;font-weight:bold}

.history{
  background:white;
  padding:20px;
  border-radius:15px;
  box-shadow:0 3px 12px #0002;
}

.history h2{
  color:#b30000;
  text-align:center;
  margin-bottom:15px;
}

.entry{
  border-bottom:1px solid #ddd;
  padding:12px 0;
}

.entry:last-child{border-bottom:0}
.entry strong{color:#b30000}

.back{
  display:block;
  text-align:center;
  margin:20px 0;
  color:#b30000;
  text-decoration:none;
  font-weight:bold;
}

.message{
  text-align:center;
  padding:15px;
  color:#555;
}

@media(max-width:500px){
  .summary{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>💰 मेरो पैसाको हिसाब</h1>
    <p>रसाली भाई समाज परिवार चौराठा</p>
  </div>

  <div class="member">
    <strong id="memberName">सदस्यको हिसाब</strong>
    <br>
    <small id="memberId"></small>
  </div>

  <div class="summary">

    <div class="box">
      <h3>जम्मा रकम</h3>
      <p id="totalIn">रु. 0</p>
    </div>

    <div class="box">
      <h3>निकालेको रकम</h3>
      <p id="totalOut">रु. 0</p>
    </div>

    <div class="box">
      <h3>बाँकी रकम</h3>
      <p id="balance">रु. 0</p>
    </div>

  </div>

  <div class="history">

    <h2>📋 मेरो हिसाब विवरण</h2>

    <div id="entries">
      <div class="message">हिसाब खोजिँदैछ...</div>
    </div>

  </div>

  <a class="back" href="dashboard.html">
    ← Dashboard मा फर्कनुहोस्
  </a>

</div>

<script>

const SUPABASE_URL =
"https://hvcalffbwvbwekysukdo.supabase.co";

const SUPABASE_KEY =
"sb_publishable_H1JXNd85d9TMWjKO6xWlTg_OZWv8Plt";

const entriesBox =
document.getElementById("entries");

async function loadMoney(){

  try{

    /*
      पहिले URL बाट member_id खोज्छ।
      उदाहरण:
      money.html?member_id=1
    */

    const params =
      new URLSearchParams(window.location.search);

    let memberId =
      params.get("member_id");

    /*
      URL मा member_id नभए localStorage मा
      राखिएको member_id प्रयोग गर्छ।
    */

    if(!memberId){

      memberId =
        localStorage.getItem("rasali_member_id");

    }

    if(!memberId){

      entriesBox.innerHTML =
        '<div class="message">सदस्य ID भेटिएन।</div>';

      return;
    }

    document.getElementById("memberId").textContent =
      "Member ID: " + memberId;

    /* MEMBER NAME */

    const memberResponse =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/members?id=eq." +
        encodeURIComponent(memberId) +
        "&select=id,name,position",
        {
          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":"Bearer " + SUPABASE_KEY
          }
        }
      );

    const members =
      await memberResponse.json();

    if(members.length > 0){

      document.getElementById("memberName").textContent =
        members[0].name || "सदस्य";

    }

    /* MONEY RECORDS */

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/money_records?member_id=eq." +
        encodeURIComponent(memberId) +
        "&select=id,record_type,person,amount,record_date,description&order=record_date.desc",
        {
          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":"Bearer " + SUPABASE_KEY
          }
        }
      );

    const records =
      await response.json();

    if(!response.ok){

      entriesBox.innerHTML =
        '<div class="message">हिसाब निकाल्न समस्या भयो।</div>';

      return;
    }

    let totalIn = 0;
    let totalOut = 0;

    entriesBox.innerHTML = "";

    if(records.length === 0){

      entriesBox.innerHTML =
        '<div class="message">यस सदस्यको अहिलेसम्म कुनै हिसाब छैन।</div>';

    }

    records.forEach(function(item){

      const amount =
        Number(item.amount) || 0;

      if(item.record_type === "income"){
        totalIn += amount;
      }

      if(item.record_type === "expense"){
        totalOut += amount;
      }

      const div =
        document.createElement("div");

      div.className = "entry";

      div.innerHTML =
        "<strong>मिति:</strong> " +
        (item.record_date || "-") +

        "<br><strong>प्रकार:</strong> " +
        (item.record_type === "income"
          ? "जम्मा रकम"
          : "निकालेको रकम") +

        "<br><strong>रकम:</strong> रु. " +
        amount.toLocaleString() +

        "<br><strong>विवरण:</strong> " +
        (item.description || "-");

      entriesBox.appendChild(div);

    });

    document.getElementById("totalIn").textContent =
      "रु. " + totalIn.toLocaleString();

    document.getElementById("totalOut").textContent =
      "रु. " + totalOut.toLocaleString();

    document.getElementById("balance").textContent =
      "रु. " +
      (totalIn - totalOut).toLocaleString();

  }catch(error){

    entriesBox.innerHTML =
      '<div class="message">Internet वा Supabase connection मा समस्या भयो।</div>';

    console.log(error);

  }

}

loadMoney();

</script>

</body>
</html>
